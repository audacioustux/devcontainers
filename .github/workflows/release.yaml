name: "Release dev container features & Generate Documentation"
on:
  workflow_run:
    workflows: ["CI - Test Features"]
    branches: ["main"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v3
        with:
          # The base revision is needed to work out which Features changed.
          fetch-depth: 0

      - name: "Determine which Features to publish"
        id: detect
        run: |
          set -euo pipefail

          base_ref=""
          head_ref=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # The commit that was tested on main. Everything it changed
            # relative to its parent is what needs to be published.
            head_ref="${{ github.event.workflow_run.head_sha }}"
            base_ref="${head_ref}^"
          fi

          features=$(./scripts/changed-features.sh "${base_ref:-origin/main}" "${head_ref}")

          if [ -z "${features}" ]; then
            echo "No Features changed, nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Features to publish:"
          echo "${features}"

          # Stage only the changed Features so that the publish step does not
          # re-publish every Feature in the repository.
          rm -rf ./features-to-publish
          mkdir -p ./features-to-publish
          while read -r feature; do
            [ -z "${feature}" ] && continue
            cp -a "./src/${feature}" "./features-to-publish/${feature}"
          done <<< "${features}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "features<<EOF" >> "$GITHUB_OUTPUT"
          echo "${features}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: "Publish Features"
        if: ${{ steps.detect.outputs.changed == 'true' }}
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./features-to-publish"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Generate Documentation"
        if: ${{ steps.detect.outputs.changed == 'true' }}
        uses: devcontainers/action@v1
        with:
          generate-docs: "true"
          base-path-to-features: "./src"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Update Featues List in README"
        run: |
          set -e
          features=$(find src -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          echo "Found features: $features"
          echo "Updating README.md"
          sed -i -e '/<!-- FEATURES_LIST_START -->/,/<!-- FEATURES_LIST_END -->/d' README.md
          echo "<!-- FEATURES_LIST_START -->" >> README.md
          for feature in $features; do
            echo "- [$feature](`git remote get-url origin`/tree/main/src/$feature)" >> README.md
          done
          echo "<!-- FEATURES_LIST_END -->" >> README.md
          git add README.md

      - name: Create PR for Documentation
        id: push_image_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Start."
          # Configure git and Push updates
          git config --global user.email github-actions@github.com
          git config --global user.name github-actions
          git config pull.rebase false
          branch=automated-documentation-update-$GITHUB_RUN_ID
          git checkout -b $branch
          message='Automated documentation update'
          # Add / update and commit
          git add */**/README.md
          git commit -m 'Automated documentation update [skip ci]' || export NO_UPDATES=true
          # Push
          if [ "$NO_UPDATES" != "true" ] ; then
              git push origin "$branch"
              gh pr create --title "$message" --body "$message"
          fi
