name: "CI - Test Features"
on:
  workflow_run:
    workflows: ["Validate devcontainer-feature.json files"]
    branches: ["main"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      features:
        description: "Comma-separated list of Features to test. Leave empty to test all of them."
        required: false
        type: string
  pull_request:
jobs:
  # Works out which Features actually changed, so that the jobs below only
  # build the Features that are affected by the change under test.
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.detect.outputs.features }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
        with:
          # The base revision is needed to compute the diff.
          fetch-depth: 0

      - name: "Determine which Features to test"
        id: detect
        run: |
          set -euo pipefail

          base_ref=""
          head_ref=""
          case "${{ github.event_name }}" in
            pull_request)
              base_ref="origin/${{ github.base_ref }}"
              ;;
            workflow_run)
              # The checkout is already at the tested commit, so compare it
              # against its parent to find out what that commit changed.
              head_ref="${{ github.event.workflow_run.head_sha }}"
              base_ref="${head_ref}^"
              ;;
          esac

          # An explicit list of Features always wins, so that a Feature can be
          # re-tested on demand without touching any code.
          if [ -n "${{ inputs.features }}" ]; then
            features=$(echo "${{ inputs.features }}" | tr ',' '\n' | sed '/^$/d')
          elif [ -z "${base_ref}" ]; then
            # No base revision to compare against: test everything.
            features=$(./scripts/changed-features.sh origin/main)
          else
            features=$(./scripts/changed-features.sh "${base_ref}" "${head_ref}")
          fi

          if [ -z "${features}" ]; then
            echo "No Features changed, nothing to test."
            echo "features=" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Features to test:"
          echo "${features}"

          echo "features<<EOF" >> "$GITHUB_OUTPUT"
          echo "${features}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "matrix={\"include\":$(echo "${features}" | jq -R -s -c 'split("\n") | map(select(length > 0) | {feature: .})')}" >> "$GITHUB_OUTPUT"

  test-autogenerated:
    needs: detect_changes
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.detect_changes.outputs.features != '' }}
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v3
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Generating tests for '${{ matrix.feature }}' against 'mcr.microsoft.com/devcontainers/base:ubuntu'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.feature }} -i mcr.microsoft.com/devcontainers/base:ubuntu .

  test-scenarios:
    needs: detect_changes
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.detect_changes.outputs.features != '' }}
    strategy:
      matrix: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v3
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Generating tests for '${{ matrix.feature }}' scenarios"
        run: devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated .

  test-global:
    needs: detect_changes
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.detect_changes.outputs.features != '' }}
    steps:
      - uses: actions/checkout@v3
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
